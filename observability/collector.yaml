receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 96
  resource:
    attributes:
    - key: service.namespace
      value: payment-poc
      action: upsert
  attributes/privacy:
    actions:
    - key: http.request.header.authorization
      action: delete
    - key: http.request.header.x_serverless_authorization
      action: delete
    - key: http.request.header.x-serverless-authorization
      action: delete
    - key: http.request.header.cookie
      action: delete
    - key: db.statement
      action: delete
    - key: db.query.text
      action: delete
  batch:
    timeout: 1s
    send_batch_size: 512
  transform/log-secrets:
    error_mode: propagate
    log_statements:
    - context: log
      statements:
      - replace_pattern(body, "(?i)(password|access_token|api_key)[=:][^ ,;]+", "[REDACTED]")
        where IsString(body)
      - replace_pattern(body, "(?i)bearer [a-zA-Z0-9._~-]+", "Bearer [REDACTED]")
        where IsString(body)
exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    sending_queue:
      queue_size: 1000
      storage: file_storage/queue
    retry_on_failure:
      enabled: true
      max_elapsed_time: 5m
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    sending_queue:
      queue_size: 1000
      storage: file_storage/queue
    retry_on_failure:
      enabled: true
      max_elapsed_time: 5m
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage/queue:
    directory: /var/lib/otelcol/queues
    timeout: 10s
service:
  extensions:
  - health_check
  - file_storage/queue
  pipelines:
    traces:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - resource
      - attributes/privacy
      - batch
      exporters:
      - otlp/tempo
    metrics:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - resource
      - batch
      exporters:
      - prometheus
    logs:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - resource
      - attributes/privacy
      - transform/log-secrets
      - batch
      exporters:
      - otlphttp/loki
  telemetry:
    logs:
      encoding: json
    metrics:
      level: normal
      readers:
      - pull:
          exporter:
            prometheus:
              host: 0.0.0.0
              port: 8888
              without_type_suffix: true
              without_units: true
