global:
  scrape_interval: 10s
  evaluation_interval: 10s
rule_files:
- /etc/prometheus/alerts.yaml
scrape_configs:
- job_name: otel-applications
  static_configs:
  - targets:
    - otel-collector:8889
- job_name: tempo
  static_configs:
  - targets:
    - tempo:3200
- job_name: prometheus
  static_configs:
  - targets:
    - localhost:9090
- job_name: otel-collector-internal
  static_configs:
  - targets:
    - otel-collector:8888
- job_name: rabbitmq
  metrics_path: /metrics/per-object
  static_configs:
  - targets:
    - rabbitmq:15692
- job_name: alertmanager
  static_configs:
  - targets:
    - alertmanager:9093
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - alertmanager:9093
