global:
  scrape_interval: 10s
  evaluation_interval: 10s
rule_files: [/etc/prometheus/alerts.yaml]
scrape_configs:
  - job_name: otel-applications
    static_configs:
      - targets: [otel-collector:8889]
  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
