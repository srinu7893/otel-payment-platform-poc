global:
  resolve_timeout: 1m
route:
  receiver: local-incident-inbox
  group_by: [alertname, service, service_name, owner]
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1h
receivers:
- name: local-incident-inbox
  webhook_configs:
  - url: http://incident-inbox:8090/webhook
    send_resolved: true
inhibit_rules:
- source_matchers: ['alertname="TelemetryScrapeUnavailable"']
  target_matchers: ['alertname="ServiceSpanErrorRatio"']
