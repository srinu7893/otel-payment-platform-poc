steps:
- name: maven:3.9.9-eclipse-temurin-21
  entrypoint: mvn
  args: ['-B', '-pl', 'customer-service', '-am', 'package', '-DskipTests']
- name: gcr.io/cloud-builders/curl
  entrypoint: bash
  args: ['-c', 'bash scripts/setup-otel-agent.sh && cp observability/agent/opentelemetry-javaagent.jar customer-service/target/opentelemetry-javaagent.jar']
- name: gcr.io/cloud-builders/docker
  args: ['build', '--target', 'cloud', '--build-arg', 'JAR_FILE=target/customer-service-0.1.0-SNAPSHOT.jar', '--label', 'org.opencontainers.image.revision=${_REVISION}', '-f', 'customer-service/Dockerfile', '-t', 'us-central1-docker.pkg.dev/project-c9bd3d0e-266f-47bf-852/otel-payment-platform/customer-service:${_REVISION}', 'customer-service']
images:
- 'us-central1-docker.pkg.dev/project-c9bd3d0e-266f-47bf-852/otel-payment-platform/customer-service:${_REVISION}'
substitutions:
  _REVISION: manual
