server:
  port: 8082
spring:
  application:
    name: mock-bank-service
  datasource:
    url: jdbc:postgresql://localhost:5432/payments
    username: payments
    password: payments
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: bank
  flyway:
    enabled: true
    create-schemas: true
    schemas: bank
    default-schema: bank
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics
