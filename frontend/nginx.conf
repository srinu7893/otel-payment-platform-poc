limit_req_zone $binary_remote_addr zone=rum_ingest:1m rate=2r/s;
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    location = /api/v1/telemetry/rum {
        client_max_body_size 512;
        limit_req zone=rum_ingest burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://api-gateway:8088;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
    }

    location = /health {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location /api/ {
        proxy_pass http://api-gateway:8088/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
