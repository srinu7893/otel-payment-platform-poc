server:
  port: 8081
spring:
  application:
    name: gateway-service
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
clients:
  http:
    connect-timeout: 2s
    read-timeout: 5s
  bank:
    base-url: http://localhost:8082

logging:
  structured:
    format:
      console: logstash
