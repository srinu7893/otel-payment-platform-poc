server:
  port: ${PORT:8080}
spring:
  application:
    name: gateway-service
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics
clients:
  http:
    connect-timeout: 2s
    read-timeout: 5s
  bank:
    base-url: ${CLIENTS_BANK_BASE_URL:http://localhost:8082}

logging:
  structured:
    format:
      console: logstash
