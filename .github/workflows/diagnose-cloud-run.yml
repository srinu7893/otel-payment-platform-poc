name: Diagnose Cloud Run revision
on:
  workflow_dispatch:
    inputs:
      service:
        description: Existing service to inspect (read only)
        required: true
        type: choice
        options: [api-gateway, auth-service, customer-service, gateway-service, payment-service, notification-service, mock-bank-service, payment-frontend]
      revision:
        description: Exact failed revision name
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: gcp-poc
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
      with:
        workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
    - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
    - name: Read failed revision status and sanitized logs
      env:
        SERVICE: ${{ inputs.service }}
        REVISION: ${{ inputs.revision }}
      run: python3 scripts/cloud/diagnose_revision.py --service "$SERVICE" --revision "$REVISION"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cloud-run-revision-diagnostics-${{ github.run_id }}
        path: artifacts/revision-diagnostics/
