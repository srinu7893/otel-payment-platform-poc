name: manual-otel-e2e
'on':
  workflow_dispatch:
    inputs:
      resilience:
        description: Also stop/restart the demo broker and collector
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: manual-otel-e2e-${{ github.ref }}
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: otel-e2e
      RESILIENCE: ${{ inputs.resilience }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Java 21
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
    - name: Backend tests including PostgreSQL/RabbitMQ integration
      run: mvn -B clean verify
      id: backend
    - name: Prepare verified Java agent
      run: bash scripts/setup-otel-agent.sh
    - name: Validate Collector configuration
      run: bash scripts/otel-compose.sh run --rm --no-deps otel-collector validate
        --config=/etc/otelcol/config.yaml
      id: collector_config
    - name: Validate Prometheus configuration and rules
      run: bash scripts/otel-compose.sh run --rm --no-deps --entrypoint promtool prometheus
        check config /etc/prometheus/prometheus.yml
      id: prometheus_config
    - name: Start instrumented demo
      run: 'bash scripts/otel-compose.sh config --quiet

        bash scripts/otel-compose.sh up --build -d'
      id: stack
    - name: Wait for all services
      run: bash scripts/e2e/wait-ready.sh
      id: health
    - name: Payment, refund, replay, risk, notification and P2P
      run: bash scripts/e2e/business-smoke.sh
      id: business
    - name: Assert real traces, metrics, logs and access controls
      run: python3 scripts/e2e/otel_acceptance.py
      id: telemetry
    - name: Bank timeout, bank error, support health and API docs
      run: bash scripts/pre_otel_acceptance.sh
      id: failures
    - name: Generate current HTML handover
      if: always()
      run: python3 scripts/render-poc-guide.py
      env:
        POC_PIPELINE_OUTCOMES: '{"Backend tests including PostgreSQL/RabbitMQ integration":
          "${{ steps.backend.outcome }}", "Validate Collector configuration": "${{
          steps.collector_config.outcome }}", "Validate Prometheus configuration and
          rules": "${{ steps.prometheus_config.outcome }}", "Start instrumented demo":
          "${{ steps.stack.outcome }}", "Wait for all services": "${{ steps.health.outcome
          }}", "Payment, refund, replay, risk, notification and P2P": "${{ steps.business.outcome
          }}", "Assert real traces, metrics, logs and access controls": "${{ steps.telemetry.outcome
          }}", "Bank timeout, bank error, support health and API docs": "${{ steps.failures.outcome
          }}"}'
    - name: Capture diagnostic logs
      if: always()
      run: 'mkdir -p artifacts

        bash scripts/otel-compose.sh ps > artifacts/compose-status.txt

        bash scripts/otel-compose.sh logs --no-color > artifacts/compose.log'
    - name: Upload evidence and HTML
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: otel-poc-evidence-${{ github.run_number }}
        path: 'artifacts/

          docs/POC_GUIDE.html

          **/target/surefire-reports/'
        retention-days: 7
    - name: Remove disposable stack
      if: always()
      run: bash scripts/otel-compose.sh down -v --remove-orphans
