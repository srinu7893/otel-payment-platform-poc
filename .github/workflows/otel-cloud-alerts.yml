name: OTel Cloud alerts
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Publish policies to the selected existing notification channel
        type: boolean
        default: false
      channel:
        description: Existing projects/PROJECT/notificationChannels/ID
        type: string
        default: ''
permissions:
  contents: read
  id-token: write
concurrency:
  group: otel-cloud-alerts
  cancel-in-progress: false
jobs:
  alerts:
    if: github.ref == 'refs/heads/main'
    environment: gcp-poc
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
      if: inputs.apply
      with:
        workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
        service_account: ${{ secrets.GCP_OBSERVABILITY_SERVICE_ACCOUNT || secrets.GCP_SERVICE_ACCOUNT }}
    - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      if: inputs.apply
    - name: Render or publish alert policies
      env:
        APPLY: ${{ inputs.apply }}
        CHANNEL: ${{ inputs.channel }}
      run: |
        args=()
        if [ "$APPLY" = true ]; then
          python3 scripts/cloud/otel_access.py --project project-c9bd3d0e-266f-47bf-852 --scope alerts
          args+=(--apply --channel "$CHANNEL")
        fi
        python3 scripts/cloud/otel_alerts.py --project project-c9bd3d0e-266f-47bf-852 "${args[@]}"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: otel-cloud-alerts-${{ github.run_id }}
        path: |
          deploy/cloud-run/alerts/
          artifacts/cloud-alerts/
          artifacts/otel-access/
