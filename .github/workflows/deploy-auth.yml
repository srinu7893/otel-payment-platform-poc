name: Deploy auth-service
on:
  workflow_dispatch:
    inputs:
      collector_image:
        description: Optional immutable collector digest (otherwise use configured COLLECTOR_IMAGE)
        type: string
        default: ''
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: cloud-run-auth-service
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: gcp-poc
    timeout-minutes: 35
    env:
      SERVICE: auth-service
      REGISTRY: us-central1-docker.pkg.dev/project-c9bd3d0e-266f-47bf-852/otel-payment-platform
      CLOUD_CONFIG: ${{ vars.CLOUD_RUN_CONFIG_JSON }}
      COLLECTOR_IMAGE: ${{ inputs.collector_image || vars.COLLECTOR_IMAGE }}
      FRONTEND_GRAFANA_URL: ${{ vars.GRAFANA_URL }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false
    - name: Require passing CI for this exact commit
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: bash scripts/cloud/workflow_service.sh ci
    - uses: actions/setup-java@v5
      if: env.SERVICE != 'frontend'
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
    - name: Validate required deployment configuration
      run: bash scripts/cloud/workflow_service.sh validate
    - name: Authenticate with Workload Identity Federation
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
    - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
    - name: Build and push selected service only
      run: bash scripts/cloud/workflow_service.sh publish
    - name: Deploy only selected Cloud Run service
      run: bash scripts/cloud/workflow_service.sh deploy
    - name: Upload selected service deployment evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: service-release-auth-service-${{ github.run_id }}
        path: artifacts/service-release/
        if-no-files-found: ignore
