name: payment-platform-ci

on:
  push:
    branches: [ main, feature/baseline-payment-platform ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test backend
        run: mvn -B clean test

      - name: Package backend services
        run: mvn -B package -DskipTests

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build full-stack containers
        run: docker compose build

      - name: Start full stack
        run: docker compose up -d

      - name: Wait for backend health
        shell: bash
        run: |
          set -euo pipefail
          ports=(8079 8084 8082 8081 8080 8083 8088)
          for port in "${ports[@]}"; do
            echo "Waiting for service on port ${port}..."
            for attempt in {1..60}; do
              if curl --fail --silent "http://localhost:${port}/actuator/health" >/dev/null; then
                echo "Port ${port} healthy"
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                echo "Service on port ${port} did not become healthy"
                docker compose ps
                docker compose logs --no-color
                exit 1
              fi
              sleep 2
            done
          done

      - name: Smoke test login, payment, outbox, refund, risk, failures and P2P transfer
        shell: bash
        run: |
          set -euo pipefail

          api_call() {
            local name="$1"
            local output="$2"
            shift 2
            local status
            status=$(curl --silent --show-error --output "$output" --write-out '%{http_code}' "$@")
            echo "${name} HTTP ${status}"
            cat "$output"
            echo
            if [[ "$status" -lt 200 || "$status" -ge 300 ]]; then
              echo "${name} failed; dumping relevant service logs"
              docker compose logs --no-color api-gateway auth-service payment-service gateway-service mock-bank-service notification-service
              exit 1
            fi
          }

          api_expect_status() {
            local expected="$1"
            local name="$2"
            local output="$3"
            shift 3
            local status
            status=$(curl --silent --show-error --output "$output" --write-out '%{http_code}' "$@")
            echo "${name} HTTP ${status} (expected ${expected})"
            cat "$output"
            echo
            if [ "$status" != "$expected" ]; then
              echo "${name} returned unexpected status"
              docker compose logs --no-color api-gateway auth-service payment-service gateway-service mock-bank-service notification-service
              exit 1
            fi
          }

          api_call "login" /tmp/login.json -X POST http://localhost:8088/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -H 'X-Correlation-Id: ci-login-001' \
            -d '{"username":"demo","password":"demo123"}'
          TOKEN=$(jq -r '.accessToken' /tmp/login.json)
          test -n "$TOKEN"
          test "$TOKEN" != "null"

          api_call "payment" /tmp/payment.json -X POST http://localhost:8088/api/v1/payments \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -H 'X-Correlation-Id: ci-payment-001' \
            -d '{"idempotencyKey":"ci-pay-001","accountNumber":"ACC1001","merchant":"CI Demo Store","amount":25.00}'
          test "$(jq -r '.status' /tmp/payment.json)" = "COMPLETED"
          PAYMENT_ID=$(jq -r '.paymentId' /tmp/payment.json)

          NOTIFICATION_FOUND=false
          for attempt in {1..30}; do
            api_call "payment notification poll" /tmp/notifications.json \
              -X GET "http://localhost:8088/api/v1/notifications?paymentId=${PAYMENT_ID}&page=0&size=20" \
              -H "Authorization: Bearer $TOKEN" \
              -H 'X-Correlation-Id: ci-notification-poll-001'
            if jq -e --arg paymentId "$PAYMENT_ID" '.content[]? | select(.paymentId == $paymentId and .eventType == "PAYMENT_COMPLETED" and .status == "SENT")' /tmp/notifications.json >/dev/null; then
              NOTIFICATION_FOUND=true
              break
            fi
            sleep 1
          done
          if [ "$NOTIFICATION_FOUND" != "true" ]; then
            echo "No SENT PAYMENT_COMPLETED notification observed for payment ${PAYMENT_ID}"
            docker compose logs --no-color payment-service notification-service rabbitmq
            exit 1
          fi

          api_call "payment idempotent replay" /tmp/payment-replay.json -X POST http://localhost:8088/api/v1/payments \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -H 'X-Correlation-Id: ci-payment-replay-001' \
            -d '{"idempotencyKey":"ci-pay-001","accountNumber":"ACC1001","merchant":"CI Demo Store","amount":25.00}'
          test "$(jq -r '.status' /tmp/payment-replay.json)" = "COMPLETED"
          test "$(jq -r '.paymentId' /tmp/payment-replay.json)" = "$PAYMENT_ID"

          api_call "refund" /tmp/refund.json -X POST "http://localhost:8088/api/v1/payments/${PAYMENT_ID}/refunds" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -H 'X-Correlation-Id: ci-refund-001' \
            -d '{"idempotencyKey":"ci-refund-001"}'
          test "$(jq -r '.status' /tmp/refund.json)" = "COMPLETED"
          test "$(jq -r '.paymentId' /tmp/refund.json)" = "$PAYMENT_ID"
          REFUND_ID=$(jq -r '.refundId' /tmp/refund.json)
          test -n "$REFUND_ID"
          test "$REFUND_ID" != "null"

          api_call "refund idempotent replay" /tmp/refund-replay.json -X POST "http://localhost:8088/api/v1/payments/${PAYMENT_ID}/refunds" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -H 'X-Correlation-Id: ci-refund-replay-001' \
            -d '{"idempotencyKey":"ci-refund-001"}'
          test "$(jq -r '.status' /tmp/refund-replay.json)" = "COMPLETED"
          test "$(jq -r '.refundId' /tmp/refund-replay.json)" = "$REFUND_ID"

          REFUND_NOTIFICATION_FOUND=false
          for attempt in {1..30}; do
            api_call "refund notification poll" /tmp/refund-notifications.json \
              -X GET "http://localhost:8088/api/v1/notifications?page=0&size=20" \
              -H "Authorization: Bearer $TOKEN" \
              -H 'X-Correlation-Id: ci-refund-notification-poll-001'
            if jq -e --arg paymentId "$PAYMENT_ID" '.content[]? | select(.paymentId == $paymentId and .eventType == "PAYMENT_REFUNDED" and .status == "SENT")' /tmp/refund-notifications.json >/dev/null; then
              REFUND_NOTIFICATION_FOUND=true
              break
            fi
            sleep 1
          done
          if [ "$REFUND_NOTIFICATION_FOUND" != "true" ]; then
            echo "No SENT PAYMENT_REFUNDED notification observed for payment ${PAYMENT_ID}"
            docker compose logs --no-color payment-service notification-service rabbitmq gateway-service mock-bank-service
            exit 1
          fi

          api_call "get refund" /tmp/refund-get.json -X GET "http://localhost:8088/api/v1/payments/${PAYMENT_ID}/refund" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'X-Correlation-Id: ci-refund-get-001'
          test "$(jq -r '.refundId' /tmp/refund-get.json)" = "$REFUND_ID"
          test "$(jq -r '.status' /tmp/refund-get.json)" = "COMPLETED"

          api_call "insufficient funds payment" /tmp/payment-insufficient.json -X POST http://localhost:8088/api/v1/payments \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -H 'X-Correlation-Id: ci-payment-insufficient-001' \
            -d '{"idempotencyKey":"ci-pay-insufficient-001","accountNumber":"ACC1001","merchant":"CI Expensive Store","amount":6000.00}'
          test "$(jq -r '.status' /tmp/payment-insufficient.json)" = "FAILED"

          api_expect_status "422" "risk limit payment" /tmp/payment-risk.json -X POST http://localhost:8088/api/v1/payments \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -H 'X-Correlation-Id: ci-payment-risk-001' \
            -d '{"idempotencyKey":"ci-pay-risk-001","accountNumber":"ACC1001","merchant":"CI Risk Store","amount":100001.00}'
          test "$(jq -r '.code' /tmp/payment-risk.json)" = "RISK_LIMIT_EXCEEDED"
          test "$(jq -r '.fieldErrors.rule' /tmp/payment-risk.json)" = "MAX_TRANSACTION_AMOUNT"

          api_call "transfer" /tmp/transfer.json -X POST http://localhost:8088/api/v1/transfers \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -H 'X-Correlation-Id: ci-transfer-001' \
            -d '{"idempotencyKey":"ci-transfer-001","senderAccount":"ACC1001","receiverAccount":"ACC2001","amount":10.00,"currency":"INR"}'
          test "$(jq -r '.status' /tmp/transfer.json)" = "COMPLETED"

      - name: Show stack status
        if: always()
        run: docker compose ps

      - name: Tear down full stack
        if: always()
        run: docker compose down -v
