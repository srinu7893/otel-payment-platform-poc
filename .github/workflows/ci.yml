name: payment-platform-ci

on:
  push:
    branches: [ main, feature/baseline-payment-platform ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B clean test
      - name: Package services
        run: mvn -B package -DskipTests
