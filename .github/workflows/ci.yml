name: payment-platform-ci
concurrency:
  group: payment-platform-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Java 21
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
    - name: Build and test backend
      run: mvn -B clean test
    - name: Package backend services
      run: mvn -B package -DskipTests
    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci --no-audit --no-fund
    - name: Build frontend
      working-directory: frontend
      run: npm run build
    - name: Test local incident receiver
      run: python3 -m unittest discover -s observability/incident-inbox -p "test_*.py"
    - name: Validate cloud release contracts
      run: python3 -m unittest discover -s scripts/cloud -p 'test_*.py'
    - name: Validate Docker Compose
      run: docker compose config --quiet
    - name: Build full-stack containers
      run: docker compose build
'on':
  push:
    branches:
    - main
    - feature/baseline-payment-platform
  pull_request:
    branches:
    - main
