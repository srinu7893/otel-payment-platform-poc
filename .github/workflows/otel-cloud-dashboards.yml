name: OTel Cloud dashboards
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Publish or update the eight POC dashboards
        type: boolean
        default: false
      verify_queries:
        description: Query stored metrics and fail if any panel has no data
        type: boolean
        default: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: otel-cloud-dashboards
  cancel-in-progress: false
jobs:
  dashboards:
    if: github.ref == 'refs/heads/main'
    environment: gcp-poc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
      with:
        workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
    - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
    - name: Render and optionally publish or verify
      env:
        APPLY: ${{ inputs.apply }}
        VERIFY: ${{ inputs.verify_queries }}
      run: |
        args=()
        if [ "$APPLY" = true ]; then args+=(--apply); fi
        if [ "$VERIFY" = true ]; then args+=(--verify-queries); fi
        python3 scripts/cloud/otel_dashboards.py --project project-c9bd3d0e-266f-47bf-852 "${args[@]}"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: otel-cloud-dashboards-${{ github.run_id }}
        path: |
          deploy/cloud-run/dashboards/
          artifacts/cloud-dashboards/
