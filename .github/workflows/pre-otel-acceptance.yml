name: pre-otel-baseline-acceptance

on:
  push:
    branches: [ feature/baseline-payment-platform ]

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Package backend services
        run: mvn -B package -DskipTests

      - name: Start full stack
        run: docker compose up --build -d

      - name: Wait for all backend services
        shell: bash
        run: |
          set -euo pipefail
          ports=(8079 8084 8082 8081 8080 8083 8088)
          for port in "${ports[@]}"; do
            echo "Waiting for service on port ${port}..."
            ready=false
            for attempt in {1..90}; do
              if curl --fail --silent "http://localhost:${port}/actuator/health" >/dev/null; then
                ready=true
                break
              fi
              sleep 2
            done
            if [ "$ready" != "true" ]; then
              echo "Service on port ${port} did not become healthy"
              docker compose ps
              docker compose logs --no-color
              exit 1
            fi
          done

      - name: Run pre-OTel acceptance
        run: bash scripts/pre_otel_acceptance.sh

      - name: Show stack status
        if: always()
        run: docker compose ps

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down full stack
        if: always()
        run: docker compose down -v
