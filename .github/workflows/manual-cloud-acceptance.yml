name: manual-cloud-acceptance
on:
  workflow_dispatch:
    inputs:
      trace_id:
        description: Optional existing trace ID for read-only recheck (no new payment)
        type: string
        default: ''
permissions:
  contents: read
  id-token: write
concurrency:
  group: otel-gcp-poc
  cancel-in-progress: false
jobs:
  acceptance:
    if: github.ref == 'refs/heads/main'
    environment: gcp-poc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false
    - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
        service_account: ${{ secrets.GCP_OBSERVABILITY_SERVICE_ACCOUNT || secrets.GCP_SERVICE_ACCOUNT }}
    - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
    - name: Check read access before creating any sandbox payment
      env:
        OBSERVER_ACCOUNT: ${{ secrets.GCP_OBSERVABILITY_SERVICE_ACCOUNT || secrets.GCP_SERVICE_ACCOUNT }}
      run: python3 scripts/cloud/otel_access.py --project project-c9bd3d0e-266f-47bf-852 --scope signals
    - name: Validate isolated PoC cloud signals and fake transaction
      env:
        ALLOW_FAKE_PAYMENT: 'true'
        TEST_CUSTOMER_USERNAME: ${{ secrets.TEST_CUSTOMER_USERNAME }}
        TEST_CUSTOMER_PASSWORD: ${{ secrets.TEST_CUSTOMER_PASSWORD }}
        TRACE_ID: ${{ inputs.trace_id }}
      run: |
        args=()
        if [ -n "$TRACE_ID" ]; then args+=(--trace-id "$TRACE_ID"); fi
        python3 scripts/cloud/cloud_acceptance.py --project project-c9bd3d0e-266f-47bf-852 --region us-central1 "${args[@]}"
    - name: Upload cloud test evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cloud-acceptance-${{ github.run_id }}
        path: |
          artifacts/cloud-acceptance/
          artifacts/otel-access/
        retention-days: 30
