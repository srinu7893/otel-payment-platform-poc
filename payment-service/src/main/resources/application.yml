server:
  port: 8080

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/payments
    username: payments
    password: payments
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: payment
  flyway:
    enabled: true
    create-schemas: true
    schemas: payment
    default-schema: payment
  rabbitmq:
    host: localhost
    port: 5672
    username: payments
    password: payments
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

security:
  jwt:
    secret: ${JWT_SECRET:change-this-demo-secret-change-this-demo-secret}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

clients:
  http:
    connect-timeout: 2s
    read-timeout: 5s
  gateway:
    base-url: http://localhost:8081
  customer:
    base-url: http://localhost:8084

outbox:
  relay:
    enabled: true
    fixed-delay-ms: 1000
    batch-size: 20
    confirm-timeout-ms: 5000

payment:
  reconciliation:
    enabled: true
    fixed-delay-ms: 15000
    processing-stale-ms: 30000
    batch-size: 20
    max-automatic-attempts: 10

transfer:
  reconciliation:
    enabled: true
    fixed-delay-ms: 15000
    processing-stale-ms: 30000
    batch-size: 20
    max-automatic-attempts: 10

logging:
  structured:
    format:
      console: logstash
