server:
  port: ${PORT:8080}

spring:
  application:
    name: payment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payments}
    username: ${SPRING_DATASOURCE_USERNAME:payments}
    password: ${SPRING_DATASOURCE_PASSWORD:payments}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: payment
  flyway:
    enabled: true
    create-schemas: true
    schemas: payment
    default-schema: payment
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:payments}
    password: ${SPRING_RABBITMQ_PASSWORD:payments}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

security:
  jwt:
    secret: ${JWT_SECRET:change-this-demo-secret-change-this-demo-secret}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

clients:
  http:
    connect-timeout: 2s
    read-timeout: 5s
  gateway:
    base-url: ${CLIENTS_GATEWAY_BASE_URL:http://localhost:8081}
  customer:
    base-url: ${CLIENTS_CUSTOMER_BASE_URL:http://localhost:8084}

risk:
  max-transaction-amount: ${RISK_MAX_TRANSACTION_AMOUNT:100000.00}
  max-daily-customer-amount: ${RISK_MAX_DAILY_CUSTOMER_AMOUNT:200000.00}
  max-daily-account-amount: ${RISK_MAX_DAILY_ACCOUNT_AMOUNT:200000.00}

outbox:
  relay:
    enabled: true
    fixed-delay-ms: 1000
    batch-size: 20
    confirm-timeout-ms: 5000

payment:
  reconciliation:
    enabled: true
    fixed-delay-ms: 15000
    processing-stale-ms: 30000
    batch-size: 20
    max-automatic-attempts: 10

transfer:
  reconciliation:
    enabled: true
    fixed-delay-ms: 15000
    processing-stale-ms: 30000
    batch-size: 20
    max-automatic-attempts: 10

refund:
  reconciliation:
    enabled: true
    fixed-delay-ms: 15000
    processing-stale-ms: 30000
    batch-size: 20
    max-automatic-attempts: 10

logging:
  structured:
    format:
      console: logstash
