server:
  port: 8080

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/payments
    username: payments
    password: payments
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: payment
  flyway:
    enabled: true
    create-schemas: true
    schemas: payment
    default-schema: payment
  rabbitmq:
    host: localhost
    port: 5672
    username: payments
    password: payments

security:
  jwt:
    secret: ${JWT_SECRET:change-this-demo-secret-change-this-demo-secret}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

clients:
  gateway:
    base-url: http://localhost:8081
  customer:
    base-url: http://localhost:8084
