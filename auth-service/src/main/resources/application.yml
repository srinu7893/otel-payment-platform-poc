server:
  port: 8079

spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payments}
    username: ${SPRING_DATASOURCE_USERNAME:payments}
    password: ${SPRING_DATASOURCE_PASSWORD:payments}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

security:
  jwt:
    # POC default only. Override JWT_SECRET in Docker/GCP and never commit a production secret.
    secret: ${JWT_SECRET:otel-payment-poc-local-secret-key-32bytes-minimum!}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics
