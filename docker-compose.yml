x-otel-environment: &otel-environment
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: none
  OTEL_PROPAGATORS: tracecontext,baggage
  OTEL_METRIC_EXPORT_INTERVAL: "5000"
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=local,service.version=0.1.0

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-payments}
      POSTGRES_USER: ${POSTGRES_USER:-payments}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payments}
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-payments} -d ${POSTGRES_DB:-payments}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-payments}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-payments}
    ports: ["5672:5672", "15672:15672", "15692:15692"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes:
      - ./observability/otel-collector-config.yml:/etc/otelcol-contrib/config.yml:ro
    depends_on:
      - jaeger
    ports:
      - "4317:4317"
      - "4318:4318"
      - "9464:9464"
      - "13133:13133"

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - otel-collector
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:13.2.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - jaeger
    ports:
      - "3001:3000"

  auth-service:
    build: ./auth-service
    environment:
      <<: *otel-environment
      OTEL_SERVICE_NAME: auth-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-payments}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-payments}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-payments}
      JWT_SECRET: ${JWT_SECRET:-change-this-demo-secret-change-this-demo-secret}
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports: ["8079:8079"]

  customer-service:
    build: ./customer-service
    environment:
      <<: *otel-environment
      OTEL_SERVICE_NAME: customer-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-payments}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-payments}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-payments}
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports: ["8084:8084"]

  mock-bank-service:
    build: ./mock-bank-service
    environment:
      <<: *otel-environment
      OTEL_SERVICE_NAME: mock-bank-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-payments}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-payments}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-payments}
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports: ["8082:8082"]

  gateway-service:
    build: ./gateway-service
    environment:
      <<: *otel-environment
      OTEL_SERVICE_NAME: gateway-service
      CLIENTS_BANK_BASE_URL: http://mock-bank-service:8082
    depends_on:
      mock-bank-service:
        condition: service_started
      otel-collector:
        condition: service_started
    ports: ["8081:8081"]

  payment-service:
    build: ./payment-service
    environment:
      <<: *otel-environment
      OTEL_SERVICE_NAME: payment-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-payments}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-payments}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-payments}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-payments}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-payments}
      CLIENTS_GATEWAY_BASE_URL: http://gateway-service:8081
      CLIENTS_CUSTOMER_BASE_URL: http://customer-service:8084
      JWT_SECRET: ${JWT_SECRET:-change-this-demo-secret-change-this-demo-secret}
      RISK_MAX_TRANSACTION_AMOUNT: ${RISK_MAX_TRANSACTION_AMOUNT:-50000.00}
      RISK_MAX_DAILY_CUSTOMER_AMOUNT: ${RISK_MAX_DAILY_CUSTOMER_AMOUNT:-100000.00}
      RISK_MAX_DAILY_ACCOUNT_AMOUNT: ${RISK_MAX_DAILY_ACCOUNT_AMOUNT:-100000.00}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      gateway-service:
        condition: service_started
      customer-service:
        condition: service_started
      otel-collector:
        condition: service_started
    ports: ["8080:8080"]

  notification-service:
    build: ./notification-service
    environment:
      <<: *otel-environment
      OTEL_SERVICE_NAME: notification-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-payments}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-payments}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-payments}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-payments}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-payments}
      JWT_SECRET: ${JWT_SECRET:-change-this-demo-secret-change-this-demo-secret}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports: ["8083:8083"]

  api-gateway:
    build: ./api-gateway
    environment:
      <<: *otel-environment
      OTEL_SERVICE_NAME: api-gateway
      JWT_SECRET: ${JWT_SECRET:-change-this-demo-secret-change-this-demo-secret}
      SERVICES_AUTH_URL: http://auth-service:8079
      SERVICES_CUSTOMER_URL: http://customer-service:8084
      SERVICES_PAYMENT_URL: http://payment-service:8080
      SERVICES_NOTIFICATION_URL: http://notification-service:8083
      SERVICES_GATEWAY_URL: http://gateway-service:8081
      SERVICES_BANK_URL: http://mock-bank-service:8082
      OBSERVABILITY_COLLECTOR_URL: http://otel-collector:13133
      OBSERVABILITY_JAEGER_URL: http://jaeger:16686
      OBSERVABILITY_PROMETHEUS_URL: http://prometheus:9090
      OBSERVABILITY_GRAFANA_URL: http://grafana:3000
      OBSERVABILITY_JAEGER_UI_URL: http://localhost:16686
      OBSERVABILITY_PROMETHEUS_UI_URL: http://localhost:9090
      OBSERVABILITY_GRAFANA_UI_URL: http://localhost:3001
    depends_on:
      auth-service:
        condition: service_started
      customer-service:
        condition: service_started
      payment-service:
        condition: service_started
      notification-service:
        condition: service_started
      gateway-service:
        condition: service_started
      mock-bank-service:
        condition: service_started
      otel-collector:
        condition: service_started
    ports: ["8088:8088"]

  frontend:
    build: ./frontend
    depends_on:
      - api-gateway
    ports: ["3000:80"]
